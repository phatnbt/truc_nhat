name: Firebase Production Deploy

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.webmanifest"
      - "icons/**"
      - "firebase.json"
      - "firestore-secure.rules"
      - ".github/security-scan.test.mjs"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p708-firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Firebase credentials
        id: credentials
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_P708_ROOM_MANAGER }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Firebase deploy skipped: repository secret FIREBASE_SERVICE_ACCOUNT_P708_ROOM_MANAGER is not configured."
          fi

      - name: Setup Node.js
        if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Scan repository for exposed credentials
        if: steps.credentials.outputs.available == 'true'
        run: node .github/security-scan.test.mjs

      - name: Validate before deploy
        if: steps.credentials.outputs.available == 'true'
        run: node .github/validate.mjs

      - name: Authenticate to Google Cloud
        if: steps.credentials.outputs.available == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_P708_ROOM_MANAGER }}

      - name: Install Firebase CLI
        if: steps.credentials.outputs.available == 'true'
        run: npm install --global firebase-tools

      - name: Generate runtime Firebase config
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://p708-room-manager.web.app/__/firebase/init.json" \
            -o firebase-config.runtime.json
          node - <<'NODE'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('firebase-config.runtime.json','utf8'));
          if(!config.apiKey || !config.authDomain || config.projectId!=='p708-room-manager' || !config.appId){
            throw new Error('Generated Firebase runtime config is invalid.');
          }
          NODE

      - name: Deploy Hosting and Firestore Rules
        if: steps.credentials.outputs.available == 'true'
        run: firebase deploy --only hosting,firestore:rules --project p708-room-manager --non-interactive

      - name: Verify public runtime config endpoint
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Origin: https://phatnbt.github.io" \
            "https://p708-room-manager.web.app/firebase-config.runtime.json" \
            -o /tmp/p708-runtime-config.json
          node - <<'NODE'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('/tmp/p708-runtime-config.json','utf8'));
          if(!config.apiKey || config.projectId!=='p708-room-manager' || !config.appId){
            throw new Error('Deployed Firebase runtime config is invalid.');
          }
          NODE
          curl --fail --silent --show-error --head \
            -H "Origin: https://phatnbt.github.io" \
            "https://p708-room-manager.web.app/firebase-config.runtime.json" \
            | grep -qi '^access-control-allow-origin: https://phatnbt.github.io'

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.credentials.outputs.available }}" = "true" ]; then
            echo "Firebase production deploy was attempted for project p708-room-manager." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Firebase production deploy was not attempted because FIREBASE_SERVICE_ACCOUNT_P708_ROOM_MANAGER is missing." >> "$GITHUB_STEP_SUMMARY"
          fi
