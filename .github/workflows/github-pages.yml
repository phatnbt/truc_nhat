name: GitHub Pages Deploy

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "sw.js"
      - "offline.html"
      - "manifest.webmanifest"
      - "**/*.css"
      - "src/**"
      - "icons/**"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build public Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html app.js sw.js offline.html manifest.webmanifest _site/
          find . -maxdepth 1 -type f -name '*.css' -exec cp {} _site/ \;
          cp -R src icons _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
