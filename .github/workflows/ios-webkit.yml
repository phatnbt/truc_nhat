name: P708 iOS WebKit Recovery

on:
  push:
    branches: [main, "fix/ios-*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund firebase firebase-tools @firebase/rules-unit-testing @playwright/test
      - run: npx playwright install --with-deps webkit
      - name: WebKit shell, recovery, isolated diagnostics and room workflows
        run: npx firebase-tools emulators:exec --only auth,firestore,hosting --project demo-p708-production-audit "node .github/mobile-boot-qa.mjs && node .github/ios-diagnostics-qa.mjs && node .github/mobile-auth-qa.mjs webkit && node .github/browser-qa.mjs webkit"
